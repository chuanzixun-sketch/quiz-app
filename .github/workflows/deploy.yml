# GitHub Pages 部署工作流
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署在运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare deploy files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp questions.xls _site/
          cp .nojekyll _site/ 2>/dev/null || true
          # 复制 assets 目录（如果存在）
          if [ -d "assets" ]; then cp -r assets _site/; fi
          echo "=== Deploy file list ==="
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
